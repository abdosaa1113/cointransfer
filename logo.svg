<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC7000;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <radialGradient id="shine" cx="30%" cy="25%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#goldGrad)" stroke-width="6" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="url(#goldGradDark)" stroke-width="2" opacity="0.6"/>

  <!-- Main coin body -->
  <circle cx="100" cy="100" r="75" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="75" fill="url(#shine)" opacity="0.4"/>

  <!-- Inner ring -->
  <circle cx="100" cy="100" r="65" fill="none" stroke="url(#goldGradDark)" stroke-width="3"/>
  <circle cx="100" cy="100" r="60" fill="none" stroke="#CC7000" stroke-width="1" opacity="0.5"/>

  <!-- Coin symbol - stylized "C" for CoinTransfer -->
  <path d="M 100 45 C 70 45 45 70 45 100 C 45 130 70 155 100 155 C 115 155 128 148 137 136"
        fill="none" stroke="#8B6914" stroke-width="14" stroke-linecap="round"/>

  <!-- Small inner detail circles -->
  <circle cx="100" cy="70" r="5" fill="#8B6914" opacity="0.6"/>
  <circle cx="100" cy="130" r="5" fill="#8B6914" opacity="0.6"/>

  <!-- Top shine arc -->
  <path d="M 60 55 Q 100 30 140 55" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
</svg>